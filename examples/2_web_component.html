<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DND Player • Web Component &lt;dnd-player&gt; Örneği</title>
  <!-- Oynatıcı Stilleri -->
  <link rel="stylesheet" href="../dist/player.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 30px;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
    }
    dnd-player {
      height: 620px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #1e293b;
    }
    .badge {
      background: #2563eb;
      color: white;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
      <div>
        <h1 style="margin: 0 0 8px 0; font-size: 24px;">Standart W3C Web Component &lt;dnd-player&gt;</h1>
        <p style="margin: 0; color: #94a3b8;">Herhangi bir JS framework'ü veya HTML sayfasında doğrudan etiket olarak çalışır.</p>
      </div>
      <span class="badge">W3C Custom Element</span>
    </div>

    <!-- STANDART HTML ETİKETİ GİBİ ÇALIŞIR -->
    <dnd-player 
      id="my-activity" 
      src="../samples/3_meyveler_sebzeler_kategori.json" 
      sound="true">
    </dnd-player>

    <div style="margin-top: 16px; display: flex; gap: 12px;">
      <button onclick="document.getElementById('my-activity').reset()" style="padding: 10px 18px; cursor: pointer; border-radius: 6px; border: none; background: #3b82f6; color: white; font-weight: 600;">
        🔄 Yeniden Başlat
      </button>
      <button onclick="alert(JSON.stringify(document.getElementById('my-activity').getState()))" style="padding: 10px 18px; cursor: pointer; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white;">
        📊 Durum Sorgula (getState)
      </button>
    </div>
  </div>

  <!-- Web Component Scripti -->
  <script src="../dist/dnd-player-element.js"></script>
  <script>
    const el = document.getElementById('my-activity');
    el.addEventListener('dnd:complete', (e) => {
      alert(`Tebrikler! Etkinliği %${e.detail.score} başarıyla tamamladınız.`);
    });
    el.addEventListener('dnd:step', (e) => {
      console.log('Adım:', e.detail);
    });
  </script>
</body>
</html>
