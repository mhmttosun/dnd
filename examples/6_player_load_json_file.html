<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DND Player • JSON Dosyası Yükleyip Çalıştırma</title>
  <link rel="stylesheet" href="../dist/player.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    .controls-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .file-dropzone {
      border: 2px dashed #0284c7;
      background: rgba(2, 132, 199, 0.08);
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .file-dropzone:hover {
      background: rgba(2, 132, 199, 0.16);
      border-color: #38bdf8;
    }
    .sample-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #475569;
      background: #334155;
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #475569;
    }
    #player-mount-point {
      height: 620px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #1e293b;
      position: relative;
    }
    .status-badge {
      font-size: 12px;
      color: #38bdf8;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h1 class="title">🎮 DND Player JSON Yükleme Demosu</h1>
        <p style="margin: 4px 0 0 0; color: #94a3b8; font-size: 13px;">
          Player; bilgisayarınızdan seçtiğiniz bir <code>.json</code> dosyasını, dosya URL'sini veya ham JSON nesnesini girdi olarak alıp anında çalıştırır.
        </p>
      </div>
      <div id="status-info" class="status-badge">● Oynatıcı Hazır</div>
    </div>

    <!-- JSON GİRDİ KONTROLLERİ -->
    <div class="controls-card">
      <!-- 1. BİLGİSAYARDAN .JSON DOSYASI SEÇME (INPUT FILE) -->
      <label class="file-dropzone" for="json-file-input">
        <span style="font-size: 20px;">📂</span>
        <div>
          <div style="font-weight: 600; font-size: 13px;">JSON Dosyası Seç</div>
          <div style="font-size: 11px; color: #94a3b8;">Bilgisayarınızdaki herhangi bir etkinlik .json dosyasını yükleyin</div>
        </div>
        <input type="file" id="json-file-input" accept=".json,application/json" style="display: none;">
      </label>

      <!-- 2. HAZIR ŞABLON URL'LERİNDEN ÇALIŞTIRMA -->
      <div class="sample-btn-group">
        <span style="font-size: 12px; color: #94a3b8;">Veya Şablon URL'den:</span>
        <button class="btn" onclick="loadUrl('../samples/1_organlari_etiketleme.json')">1. Organlar</button>
        <button class="btn" onclick="loadUrl('../samples/2_hayvanlar_eslestirme.json')">2. Hayvanlar</button>
        <button class="btn" onclick="loadUrl('../samples/3_meyveler_sebzeler_kategori.json')">3. Meyve/Sebze</button>
        <button class="btn" onclick="loadUrl('../samples/4_kelebek_yasam_dongusu_siralama.json')">4. Kelebek</button>
      </div>
    </div>

    <!-- OYNATICININ ÇALIŞTIĞI ALAN -->
    <div id="player-mount-point"></div>
  </div>

  <!-- UMD Paketi -->
  <script src="../dist/player.umd.cjs"></script>
  <script>
    const statusEl = document.getElementById('status-info');
    const fileInput = document.getElementById('json-file-input');

    // 1. OYNATICIYI BAŞLAT
    const player = new DND.ActivityPlayer({
      target: '#player-mount-point',
      src: '../samples/2_hayvanlar_eslestirme.json', // Varsayılan başlangıç
      sound: true,
      onComplete: (stats) => {
        statusEl.textContent = `🎉 Tamamlandı! Puan: %${stats.score} (${stats.attempts} Deneme)`;
        statusEl.style.color = '#4ade80';
      },
      onStep: (state) => {
        statusEl.textContent = `⚡ İlerleme: ${state.correctCount}/${state.totalDraggables} Doğru`;
      }
    });

    // 2. KULLANICI BİLGİSAYARINDAN BİR .JSON DOSYASI SEÇTİĞİNDE ÇALIŞTIRMA:
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.textContent = `⏳ ${file.name} yükleniyor...`;
      
      // player.loadFromFile(file) fonksiyonu File nesnesini doğrudan input olarak alır!
      player.loadFromFile(file).then(() => {
        statusEl.textContent = `✓ ${file.name} başarıyla yüklendi ve başladı!`;
        statusEl.style.color = '#38bdf8';
      }).catch(err => {
        statusEl.textContent = `⚠️ Hata: ${err.message}`;
        statusEl.style.color = '#ef4444';
      });
    });

    // 3. URL ÜZERİNDEN JSON YÜKLEME
    function loadUrl(url) {
      statusEl.textContent = `⏳ ${url} çekiliyor...`;
      player.loadFromUrl(url).then(() => {
        statusEl.textContent = `✓ ${url} yüklendi!`;
      });
    }
  </script>
</body>
</html>
