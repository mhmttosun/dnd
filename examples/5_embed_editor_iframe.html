<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Uygulama • Gömülü Editör ve JSON Export Örneği</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* HOST UYGULAMANIN KENDİ BAŞLIĞI */
    .host-navbar {
      height: 60px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .host-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .host-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }

    .host-badge {
      background: #334155;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #94a3b8;
    }

    .host-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .host-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #475569;
      background: #334155;
      color: #f8fafc;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .host-btn:hover {
      background: #475569;
    }

    .host-btn.primary {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }

    .host-btn.primary:hover {
      background: #0369a1;
    }

    .layout-split {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* GÖMÜLÜ EDITÖR IFRAME */
    .iframe-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* YAN BİLGİ VE JSON GÖRÜNTÜLEYİCİ PANEL */
    .json-sidebar {
      width: 380px;
      background: #090d16;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .json-code {
      flex: 1;
      padding: 16px;
      margin: 0;
      overflow: auto;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #a5f3fc;
      background: #050811;
    }
  </style>
</head>
<body>

  <!-- 1. HOST UYGULAMANIN KENDİ ARAYÜZÜ -->
  <header class="host-navbar">
    <div class="host-brand">
      <span class="host-title">🏢 Öğretmen Portalı (Host Uygulama)</span>
      <span class="host-badge">Embed Modu</span>
    </div>

    <div class="host-actions">
      <!-- HEADER AÇ / KAPAT TESTİ -->
      <button class="host-btn" id="btn-toggle-header">
        👁️ Header'ı Aç/Kapat
      </button>

      <!-- SAHNE JSON'INI AL BUTONU -->
      <button class="host-btn primary" id="btn-get-json">
        📥 Sahne JSON Verisini Al (dndExport)
      </button>
    </div>
  </header>

  <div class="layout-split">
    <!-- 2. GÖMÜLÜ EDITÖR (Headersız Mod: ?embedded=true) -->
    <div class="iframe-container">
      <iframe id="dnd-editor-frame" src="../index.html?embedded=true"></iframe>
    </div>

    <!-- 3. DIŞA AKTARILAN JSON'IN ANLIK GÖSTERİLDİĞİ HOST ALANI -->
    <div class="json-sidebar">
      <div class="sidebar-header">
        <span>Canlı Alınan JSON Verisi</span>
        <span id="change-indicator" style="color: #4ade80; font-size: 11px;">● Hazır</span>
      </div>
      <pre class="json-code" id="json-viewer">// Editör yüklendiğinde 'Sahne JSON Verisini Al' butonuna basın
// veya sahnede bir nesneyi hareket ettirdiğinizde veri buraya otomatik akacaktır.</pre>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('dnd-editor-frame');
    const jsonViewer = document.getElementById('json-viewer');
    const changeIndicator = document.getElementById('change-indicator');
    const btnGetJson = document.getElementById('btn-get-json');
    const btnToggleHeader = document.getElementById('btn-toggle-header');

    // =========================================================================
    // YÖNTEM 1: DOĞRUDAN JAVASCRIPT API (Same-origin ise en basit ve hızlısı)
    // =========================================================================
    btnGetJson.addEventListener('click', () => {
      try {
        // iframe içindeki window.dndExport() veya window.app.exportJSON() doğrudan çağrılabilir!
        const projectData = iframe.contentWindow.dndExport 
          ? iframe.contentWindow.dndExport() 
          : iframe.contentWindow.app.exportJSON();

        jsonViewer.textContent = JSON.stringify(projectData, null, 2);
        changeIndicator.textContent = '● JSON Alındı (' + new Date().toLocaleTimeString() + ')';
        changeIndicator.style.color = '#38bdf8';
      } catch (err) {
        console.warn('Doğrudan API başarısız, postMessage deneniyor:', err);
        // Yöntem 2'ye geri dön (postMessage)
        requestJsonViaPostMessage();
      }
    });

    // Header aç/kapat testi
    let headerState = false;
    btnToggleHeader.addEventListener('click', () => {
      headerState = !headerState;
      if (iframe.contentWindow.dndSetHeaderVisible) {
        iframe.contentWindow.dndSetHeaderVisible(headerState);
      } else {
        iframe.contentWindow.postMessage({ type: 'DND_SET_HEADER', visible: headerState }, '*');
      }
    });

    // =========================================================================
    // YÖNTEM 2: POSTMESSAGE ENTEGRASYONU (Cross-origin / iframe için güvenli)
    // =========================================================================
    function requestJsonViaPostMessage() {
      iframe.contentWindow.postMessage({ type: 'DND_GET_DATA' }, '*');
    }

    // Editörden gelen postMessage bildirimlerini dinle
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;

      // İstek üzerine dönen JSON yanıtı
      if (msg.type === 'DND_DATA_RESPONSE') {
        jsonViewer.textContent = JSON.stringify(msg.data, null, 2);
        changeIndicator.textContent = '● postMessage ile Alındı (' + new Date().toLocaleTimeString() + ')';
        changeIndicator.style.color = '#a855f7';
      }

      // Sahnede bir nesne taşındığında/düzenlendiğinde editörün fırlattığı canlı olay
      if (msg.type === 'DND_DATA_CHANGED') {
        jsonViewer.textContent = JSON.stringify(msg.data, null, 2);
        changeIndicator.textContent = '● Canlı Değişiklik Algılandı (' + new Date().toLocaleTimeString() + ')';
        changeIndicator.style.color = '#4ade80';
      }
    });
  </script>
</body>
</html>
